name: Blog Performance Metrics

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Skip the Search Console refresh and only redeploy the page
        type: boolean
        default: false

concurrency:
  group: blog-performance-metrics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout blog generator posts
        if: ${{ !inputs.deploy_only }}
        uses: actions/checkout@v4
        with:
          repository: conholdate/blog-generator-agent
          token: ${{ secrets.BLOG_REPOS_TOKEN }}
          path: blog-generator-agent
          sparse-checkout: content/blogPosts
          fetch-depth: 1

      - name: Set up Python
        if: ${{ !inputs.deploy_only }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ !inputs.deploy_only }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pandas searchconsole google-auth google-auth-oauthlib google-auth-httplib2

      - name: Write Google OAuth files
        if: ${{ !inputs.deploy_only }}
        env:
          GSC_CLIENT_SECRET_JSON: ${{ secrets.GSC_CLIENT_SECRET_JSON }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          [ -n "$GSC_CLIENT_SECRET_JSON" ] || { echo "Set GSC_CLIENT_SECRET_JSON secret"; exit 1; }
          [ -n "$GSC_CREDENTIALS_JSON" ] || { echo "Set GSC_CREDENTIALS_JSON secret (non-interactive auth)"; exit 1; }
          printf '%s' "$GSC_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$GSC_CREDENTIALS_JSON" > credentials.json

      - name: Refresh metrics from Search Console
        if: ${{ !inputs.deploy_only }}
        env:
          BLOG_GENERATOR_POSTS_ROOT: ${{ github.workspace }}/blog-generator-agent/content/blogPosts
        run: python blog_performance_metrics.py

      - name: Remove Google OAuth files
        if: always()
        run: rm -f client_secret.json credentials.json

      - name: Commit metrics
        if: ${{ !inputs.deploy_only }}
        run: |
          if ! git status --porcelain metrics | grep -q .; then
            echo "No metric changes."
            exit 0
          fi
          git config user.name "Farhan Raza"
          git config user.email "farhan.raza@aspose.com"
          git add metrics
          git commit -m "Update blog performance metrics"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 3
          done
          echo "Failed to push metric updates after retries."
          exit 1

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp metrics/*.csv _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: metrics
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
