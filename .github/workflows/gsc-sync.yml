name: GSC Sheets Sync

on:
  schedule:
    - cron: "0 6 1,15 * *" # 1st and 15th of every month at 06:00 UTC
  workflow_dispatch:
    inputs:
      run_aspose_com:
        description: Run blog.aspose.com export
        type: boolean
        default: false
      run_aspose_cloud:
        description: Run blog.aspose.cloud export
        type: boolean
        default: false
      run_conholdate_com:
        description: Run blog.conholdate.com export
        type: boolean
        default: false
      run_conholdate_cloud:
        description: Run blog.conholdate.cloud export
        type: boolean
        default: false
      run_groupdocs_com:
        description: Run blog.groupdocs.com export
        type: boolean
        default: false
      run_groupdocs_cloud:
        description: Run blog.groupdocs.cloud export
        type: boolean
        default: false

concurrency:
  group: gsc-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: blog.aspose.com
            input_key: run_aspose_com
            script: gsc_aspose_com.py
            repo: Aspose/aspose-blog
            path: aspose-blog
            default_branch: master
            csv_file: csv/aspose.csv
          - name: blog.aspose.cloud
            input_key: run_aspose_cloud
            script: gsc_aspose_cloud.py
            repo: aspose-cloud/aspose-cloud-blog
            path: aspose-cloud-blog
            default_branch: master
            csv_file: csv/aspose-cloud.csv
          - name: blog.conholdate.com
            input_key: run_conholdate_com
            script: gsc_conholdate_com.py
            repo: conholdate/conholdate-blog
            path: conholdate-blog
            default_branch: main
            csv_file: csv/conholdate.csv
          - name: blog.conholdate.cloud
            input_key: run_conholdate_cloud
            script: gsc_conholdate_cloud.py
            repo: conholdate-cloud/blog.conholdate.cloud
            path: blog.conholdate.cloud
            default_branch: main
            csv_file: csv/conholdate-cloud.csv
          - name: blog.groupdocs.com
            input_key: run_groupdocs_com
            script: gsc_groupdocs_com.py
            repo: groupdocs/groupdocs-blog
            path: groupdocs-blog
            default_branch: master
            csv_file: csv/groupdocs.csv
          - name: blog.groupdocs.cloud
            input_key: run_groupdocs_cloud
            script: gsc_groupdocs_cloud.py
            repo: groupdocs-cloud/groupdocs-cloud-blog
            path: groupdocs-cloud-blog
            default_branch: master
            csv_file: csv/groupdocs-cloud.csv

    # NOTE: no job-level `if:` here — the `matrix` context is not available
    # at jobs.<job_id>.if. Instead, the first step below computes a
    # per-matrix-entry "should_run" flag, and every later step is gated
    # on that step's output via `if: steps.gate.outputs.run == 'true'`.
    steps:
      - name: Determine whether this matrix entry should run
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ matrix.input_key }}" in
              run_aspose_com)        v="${{ github.event.inputs.run_aspose_com }}" ;;
              run_aspose_cloud)      v="${{ github.event.inputs.run_aspose_cloud }}" ;;
              run_conholdate_com)    v="${{ github.event.inputs.run_conholdate_com }}" ;;
              run_conholdate_cloud)  v="${{ github.event.inputs.run_conholdate_cloud }}" ;;
              run_groupdocs_com)     v="${{ github.event.inputs.run_groupdocs_com }}" ;;
              run_groupdocs_cloud)   v="${{ github.event.inputs.run_groupdocs_cloud }}" ;;
              *) v="false" ;;
            esac
            echo "run=$v" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.gate.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.name }} — not selected for this trigger."

      # Checkout THIS repo (where workflow exists)
      - name: Checkout current repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # Checkout target blog repo (private) using PAT
      - name: Checkout blog content repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.default_branch }}
          token: ${{ secrets.BLOG_REPOS_TOKEN || github.token }}
          path: ${{ matrix.path }}
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pandas searchconsole google-auth google-auth-oauthlib google-auth-httplib2

      - name: Write Google OAuth files
        if: steps.gate.outputs.run == 'true'
        env:
          GSC_CLIENT_SECRET_JSON: ${{ secrets.GSC_CLIENT_SECRET_JSON }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          [ -n "$GSC_CLIENT_SECRET_JSON" ] || { echo "Set GSC_CLIENT_SECRET_JSON secret"; exit 1; }
          printf '%s' "$GSC_CLIENT_SECRET_JSON" > client_secret.json
          if [ -n "$GSC_CREDENTIALS_JSON" ]; then
            printf '%s' "$GSC_CREDENTIALS_JSON" > credentials.json
          fi

      - name: Run ${{ matrix.name }} export
        if: steps.gate.outputs.run == 'true'
        env:
          BLOG_CONTENT_ROOT: ${{ github.workspace }}/${{ matrix.path }}
        run: python ${{ matrix.script }}

      - name: Verify Days Since Published in CSV
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path("${{ matrix.csv_file }}")
          if not p.exists():
              raise SystemExit(f"CSV not found: {p}")
          with p.open() as f:
              reader = csv.DictReader(f)
              rows = list(reader)
          key = "Days Since Published"
          non_blank = sum(
              1 for r in rows
              if str(r.get(key, "")).strip() not in ("", "None", "nan")
          )
          print(f"CSV: {p}")
          print(f"Rows: {len(rows)}")
          print(f"Non-blank '{key}': {non_blank}")
          if rows:
              print("Sample days:", [rows[i].get(key, "") for i in range(min(5, len(rows)))])
          PY

      - name: Commit CSV outputs
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "Optimizer Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f csv
          git status --short

          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "Update GSC CSVs for ${{ matrix.name }}"

          # Handle rebase conflicts automatically for csv files
          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            echo "Rebase conflict detected. Auto-resolving csv/* ..."
            while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              conflicted="$(git diff --name-only --diff-filter=U || true)"

              if [ -z "${conflicted}" ]; then
                GIT_EDITOR=true git rebase --continue || true
                continue
              fi

              if echo "${conflicted}" | grep -qv '^csv/'; then
                echo "Non-CSV conflict detected:"
                echo "${conflicted}"
                git rebase --abort
                exit 1
              fi

              git checkout --theirs -- ${conflicted}
              git add ${conflicted}
              GIT_EDITOR=true git rebase --continue || true
            done
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Cleanup OAuth files
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          rm -f client_secret.json credentials.json